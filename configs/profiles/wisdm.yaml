# ---------------------------------------------------------------------
#  WISDM profile - main WISDM-2019 (smartwatch) experiments, leakage-free protocol (B):
#    subjects: 36 FL clients / 10 held-out (new) users / 5 pool users
#    inside every client: per-activity chronological 80/20 split, 1-window gap
#  All dataset settings come from configs/datasets/wisdm.yaml.
#      python run_all.py --profile wisdm
# ---------------------------------------------------------------------
data:
  dataset: wisdm
split:
  seeds: [0]
centralized:
  epochs: 25
  patience: 5
  batch_size: 128
  max_val_windows: 6000
fl:
  rounds: 100
  clients_per_round_frac: 0.20     # 7 of 36 clients per round
  local_epochs: 2
  max_local_steps: 8               # 8 x 64 = 512 windows per update (~1.5 passes over a client's data)
  batch_size: 64                   # a client holds ~330 training windows
  eval_every: 10
  local_ft_steps: 20
  final_personalization_steps: 20
ablation:
  encoder: limu_bert
report:
  compare_profiles: []
  stage_labels: {}
